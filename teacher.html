<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师控制台 · 虚拟学校</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;color:#eef6ff;font:15px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 20% 0,#29466b,#101a31 70%)}main{width:min(100%,760px);margin:30px auto;padding:clamp(20px,5vw,38px);border:1px solid #ffffff30;border-radius:24px;background:#13233bdd;box-shadow:0 25px 80px #0006}h1{margin-top:0;color:#91eaff}p,.hint{color:#bfd0e4}.card{margin:18px 0;padding:20px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff08}label{display:block;margin:13px 0 6px;font-weight:700}input,select{width:100%;padding:12px;border:1px solid #ffffff40;border-radius:10px;color:#fff;background:#0a172c}select option{background:#0a172c;color:#fff}button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,#7de8ff,#7bf0c4);color:#11243c}.secondary{background:#ffffff1a;color:white;border:1px solid #ffffff30}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row button{flex:1}#status{min-height:24px;color:#ffe7a2;overflow-wrap:anywhere}.warning{padding:12px;border-radius:10px;background:#6c4a193c;color:#ffe5a0;font-size:13px}.hidden{display:none}code{overflow-wrap:anywhere}.selected-room{padding:10px 12px;border-radius:10px;background:#79dfff16;color:#9be9ff}
  </style>
</head>
<body>
<main>
  <h1>🧑‍🏫 教师控制台</h1>
  <p>从六个课室版块中选择一个，为每个版块设置对应的 Wayground 活动链接、人数门槛和倒计时。</p>
  <div class="warning">只有数据库规则中指定的教师 UID 才能发布活动设置。教师登录后，请将页面显示的 UID 填入 Realtime Database 规则中的教师 UID 项并发布规则。不要使用公开写入规则。</div>

  <section class="card" id="auth-card">
    <h2>教师账号</h2>
    <label for="email">邮箱</label><input id="email" type="email" autocomplete="username">
    <label for="password">密码</label><input id="password" type="password" autocomplete="current-password">
    <div class="row"><button id="login" type="button">登录</button><button class="secondary" id="register" type="button">注册教师账号</button><button class="secondary hidden" id="logout" type="button">退出登录</button></div>
    <p id="uid-line" class="hint">尚未登录。</p>
  </section>

  <section class="card">
    <h2>学习活动设置</h2>
    <label for="room">选择课室版块</label>
    <select id="room">
      <option value="1. 华文空间 🏮">1. 华文空间 🏮</option>
      <option value="2. 🌐 Ruang Melayu">2. 🌐 Ruang Melayu</option>
      <option value="3. English Zone 🇬🇧">3. English Zone 🇬🇧</option>
      <option value="4. 数学几何矩阵 📐">4. 数学几何矩阵 📐</option>
      <option value="5. 科学实验室 🧪">5. 科学实验室 🧪</option>
      <option value="6. 阳光校园广场 🏫">6. 阳光校园广场 🏫</option>
    </select>
    <p class="selected-room" id="room-note">为所选版块单独保存活动链接。</p>
    <label for="wayground">Wayground 活动链接（HTTPS）</label><input id="wayground" type="url" placeholder="https://wayground.com/..." inputmode="url">
    <label for="threshold">开始门槛（在线人数）</label><input id="threshold" type="number" min="2" max="50" value="10">
    <label for="countdown">倒计时（秒）</label><input id="countdown" type="number" min="5" max="120" value="10">
    <div class="row"><button id="save" type="button" disabled>保存此版块活动</button><button class="secondary" id="disable" type="button" disabled>停止此版块活动</button></div>
    <p id="status" role="status"></p>
  </section>
  <p class="hint">选择其他版块时会读取该版块已保存的设置。学生端会在 해당课室人数达到门槛时显示倒计时弹窗。教师页面地址：<code>/virtual-school/teacher.html</code></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(()=>{
  const config={apiKey:"AIzaSyDc9xPlyjkfo8g0HxQGvQiwlksKkOby5lg",authDomain:"cs-school-d45a3.firebaseapp.com",projectId:"cs-school-d45a3",storageBucket:"cs-school-d45a3.firebasestorage.app",messagingSenderId:"106809343013",appId:"1:106809343013:web:620ac2cee2ef8fa828d3cc",measurementId:"G-TBNSN36BSY",databaseURL:"https://cs-school-d45a3-default-rtdb.asia-southeast1.firebasedatabase.app"};
  const $=id=>document.getElementById(id);let db,auth,user=null;
  function roomKey(name){return Array.from(name).map(c=>c.codePointAt(0).toString(16)).join('_')||'default'}
  function showStatus(message){$('status').textContent=message}
  function updateUI(currentUser){user=currentUser;$('uid-line').textContent=currentUser?`已登录教师账号 · UID：${currentUser.uid}`:'尚未登录。';$('login').classList.toggle('hidden',!!currentUser);$('register').classList.toggle('hidden',!!currentUser);$('logout').classList.toggle('hidden',!currentUser);$('save').disabled=!currentUser;$('disable').disabled=!currentUser;if(currentUser)loadActivity();}
  function loadActivity(){if(!db||!user)return;const room=$('room').value;db.ref(`rooms/${roomKey(room)}/activity`).once('value').then(snapshot=>{if($('room').value!==room)return;const activity=snapshot.val();$('wayground').value=activity?.url||'';$('threshold').value=activity?.threshold||10;$('countdown').value=activity?.countdownSeconds||10;showStatus(activity?.enabled?'已载入此版块的活动设置。':'此版块目前没有启用活动。');}).catch(error=>showStatus('读取设置失败：'+error.message));}
  try{firebase.initializeApp(config);auth=firebase.auth();db=firebase.database();auth.onAuthStateChanged(updateUI);}catch(error){showStatus('Firebase 初始化失败，请检查配置。');}
  async function authenticate(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){showStatus('请输入邮箱，密码至少 6 位。');return;}try{const result=mode==='register'?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);updateUI(result.user);showStatus(mode==='register'?'教师账号已注册。请先把显示的 UID 加入数据库规则并发布。':'登录成功。');}catch(error){showStatus('操作失败：'+error.message);}}
  $('register').addEventListener('click',()=>authenticate('register'));$('login').addEventListener('click',()=>authenticate('login'));$('logout').addEventListener('click',()=>auth.signOut());$('room').addEventListener('change',loadActivity);
  async function publish(enabled){if(!user){showStatus('请先登录教师账号。');return;}const room=$('room').value,url=$('wayground').value.trim(),threshold=Number($('threshold').value),countdownSeconds=Number($('countdown').value);if(enabled&&!/^https:\/\/(www\.)?(wayground\.com|quizizz\.com)\//i.test(url)){showStatus('请输入有效的 HTTPS Wayground/Quizizz 链接。');return;}if(!Number.isInteger(threshold)||threshold<2||threshold>50||!Number.isInteger(countdownSeconds)||countdownSeconds<5||countdownSeconds>120){showStatus('人数需为 2–50，倒计时需为 5–120 秒。');return;}try{await db.ref(`rooms/${roomKey(room)}/activity`).set({url:enabled?url:'',threshold,countdownSeconds,enabled,updatedAt:firebase.database.ServerValue.TIMESTAMP});showStatus(enabled?`已保存「${room}」的活动设置。`:`已停止「${room}」的活动。`);}catch(error){showStatus('保存失败：'+error.message+'。请确认教师 UID 已加入数据库规则并发布。');}}
  $('save').addEventListener('click',()=>publish(true));$('disable').addEventListener('click',()=>publish(false));
})();
</script>
</body>
</html>
