<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟多人口堂 - 陪伴空间</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0c10; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
        
        /* 唯美星空背景与氛围 */
        .universe { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 80%); z-index: 1; overflow: hidden; }
        
        /* 登录弹窗 */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.5s; }
        .login-box { background: #1f2833; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 320px; border: 1px solid #45f3ff; }
        .login-box h2 { color: #45f3ff; margin-top: 0; font-size: 20px; }
        .login-box p { color: #c5a880; font-size: 13px; line-height: 1.4; margin-bottom: 20px; }
        .login-box input { width: 90%; padding: 12px; border-radius: 25px; border: none; background: #0b0c10; color: white; text-align: center; font-size: 16px; margin-bottom: 20px; outline: none; border: 1px solid #1f2833; }
        .login-box input:focus { border-color: #45f3ff; }
        .login-box button { background: linear-gradient(45deg, #00bbf9, #00f5d4); color: #0b0c10; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        
        /* 课室 UI 界面 */
        #room-ui { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; }
        #room-ui h1 { margin: 0; font-size: 18px; color: #45f3ff; }
        #counter { background: rgba(69, 243, 255, 0.2); padding: 4px 10px; border-radius: 10px; font-size: 12px; display: inline-block; margin-top: 5px; border: 1px solid rgba(69, 243, 255, 0.4); }
        
        /* 底部互动区 */
        #footer-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; width: 90%; max-width: 400px; }
        #status-txt { background: rgba(255,255,255,0.9); padding: 12px; border-radius: 25px; font-size: 14px; text-align: center; flex-grow: 1; font-weight: bold; color: #1f2833; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #exit-btn { background: #e43f5a; color: white; border: none; border-radius: 25px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        
        /* 仿《山寺》唯美连线与陪伴席位 */
        .classroom-stage { position: relative; width: 90vw; height: 50vh; z-index: 2; overflow: visible; display: flex; justify-content: center; align-items: center; }
        svg { width: 100%; height: 100%; overflow: visible; }
        
        /* 呼吸小沙弥/学生分身的动画 */
        .student-avatar { animation: breathe 3s ease-in-out infinite; transform-origin: center; filter: drop-shadow(0 0 8px var(--glow-color)); }
        .student-avatar:nth-child(2n) { animation-delay: -0.7s; }
        .student-avatar:nth-child(3n) { animation-delay: -1.4s; }
        .student-avatar:nth-child(4n) { animation-delay: -2.1s; }
        
        @keyframes breathe {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
            50% { transform: translateY(-6px) scale(1.05); opacity: 1; }
        }
        
        /* 教室中心的聚集线 */
        .center-glow { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="universe"></div>

    <!-- 1. 自拟名字登入弹窗 -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>🎒 化身数字学生</h2>
            <p>参考韩国《山寺》冥想概念：在这里，你可以放下压力，与在线同学静静在云端课室相伴学习。</p>
            <input type="text" id="username-input" placeholder="输入你想用的学生昵称..." maxlength="10">
            <button onclick="enterClassroom()">化身登入课室</button>
        </div>
    </div>

    <!-- 2. 课室内部界面 -->
    <div id="room-ui">
        <h1 id="room-title">加载中...</h1>
        <div id="counter">🟢 当前课室在学...</div>
    </div>

    <!-- 3. 原生全动态陪伴画面 -->
    <div class="classroom-stage" id="stage" style="display:none;">
        <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
            <!-- 教室中心的能量核心/讲台光晕 -->
            <circle cx="200" cy="150" r="15" fill="#45f3ff" class="center-glow" filter="blur(5px)" style="opacity:0.5;"/>
            <circle cx="200" cy="150" r="5" fill="#ffffff"/>
            
            <!-- 环绕的陪伴学生席位群 (动态生成) -->
            <g id="students-group"></g>
        </svg>
    </div>

    <div id="footer-bar">
        <div id="status-txt">准备入座...</div>
        <button id="exit-btn" onclick="window.location.href='index.html'">离开</button>
    </div>

    <script>
        let currentUserName = "";
        
        // 获取页面参数
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || '公共学习空间';
        document.getElementById('room-title').innerText = roomName;

        // 随机在线人数
        const randomCount = Math.floor(Math.random() * 15) + 32;
        document.getElementById('counter').innerHTML = `🟢 当前课室在学：<span>${randomCount}</span> / 50 人`;

        function enterClassroom() {
            const input = document.getElementById('username-input').value.trim();
            if (input === "") {
                alert("请先帮你的虚拟分身取一个名字吧！");
                return;
            }
            currentUserName = input;
            document.getElementById('login-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('status-txt').innerText = `✨ 学生【${currentUserName}】已在教室蒲团入座`;
                document.getElementById('stage').style.display = 'flex';
                generateClassroomSeats();
            }, 500);
        }

        // 动态生成仿《山寺》的环绕陪伴星光阵
        function generateClassroomSeats() {
            const group = document.getElementById('students-group');
            let htmlContent = "";

            // 1. 先生成30多个其他同学的陪伴荧光分身
            for (let i = 0; i < randomCount - 1; i++) {
                const angle = (i / (randomCount - 1)) * Math.PI * 2 + Math.random() * 0.4;
                const radius = 50 + Math.random() * 70; // 错落环绕在中心周围
                const cx = 200 + Math.cos(angle) * radius;
                const cy = 150 + Math.sin(angle) * radius;
                
                // 随机温暖色调（暖橙、青绿、浅紫）
                const colors = ["#ff9f43", "#00f5d4", "#9b5de5", "#00bbf9"];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                htmlContent += `
                    <g class="student-avatar" style="--glow-color: ${color};">
                        <!-- 连向中心的静谧陪伴线 -->
                        <line x1="200" y1="150" x2="${cx}" y2="${cy}" stroke="${color}" stroke-width="0.5" opacity="0.15" stroke-dasharray="2,4" />
                        <!-- 蒲团垫 -->
                        <ellipse cx="${cx}" cy="${cy+6}" rx="10" ry="4" fill="rgba(255,255,255,0.05)" />
                        <!-- 呼吸能量球/学生代表 -->
                        <circle cx="${cx}" cy="${cy}" r="5" fill="${color}" />
                        <circle cx="${cx}" cy="${cy}" r="2" fill="#fff" opacity="0.6"/>
                    </g>
                `;
            }

            // 2. 在正前方最显眼的位置，生成“你（静静）”的专属高亮分身
            const myAngle = Math.PI * 0.5; // 放在正下方中央偏前
            const myRadius = 45;
            const myCx = 200 + Math.cos(myAngle) * myRadius;
            const myCy = 150 + Math.sin(myAngle) * myRadius;
            
            htmlContent += `
                <g class="student-avatar" style="--glow-color: #45f3ff; transform: scale(1.2);">
                    <line x1="200" y1="150" x2="${myCx}" y2="${myCy}" stroke="#45f3ff" stroke-width="1" opacity="0.4" />
                    <ellipse cx="${myCx}" cy="${myCy+8}" rx="14" ry="5" fill="rgba(69, 243, 255, 0.2)" stroke="#45f3ff" stroke-width="0.5" />
                    <!-- 你的主透光能量球 -->
                    <circle cx="${myCx}" cy="${myCy}" r="7" fill="#45f3ff" />
                    <circle cx="${myCx}" cy="${myCy}" r="3" fill="#fff" />
                    <!-- 你的名字标签 -->
                    <text x="${myCx}" y="${myCy - 12}" fill="#45f3ff" font-size="9" font-weight="bold" text-anchor="middle" bgcolor="#000">${currentUserName} (你)</text>
                </g>
            `;

            group.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
