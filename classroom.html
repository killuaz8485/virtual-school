  <header id="topbar"><div><h1 id="room-heading">虚拟课室</h1><div id="room-subtitle">50人在线课堂</div><div id="counter">连接中…</div></div><button id="leave-btn" type="button">离开课室</button></header>

  <div id="activity-modal" role="dialog" aria-modal="true" aria-labelledby="activity-title"><div class="activity-box"><div style="font-size:38px">🎯</div><h2 id="activity-title">Wayground 小组挑战即将开始</h2><p id="activity-desc">在线人数达到门槛，准备一起学习！</p><div class="activity-countdown" id="countdown">10</div><p>秒后自动进入活动</p><div class="activity-actions"><button class="primary-action" id="join-activity" type="button">现在进入</button><button class="secondary-action" id="cancel-activity" type="button">暂不参加</button></div></div></div>

    const W=1100,H=720,player={x:550,y:660,name:'',bubble:'',seat:-1},keys=new Set(),users=new Map(),recent=new Map(),desks=[];let db,uid,joined=false,scale=1,ox=0,oy=0,lastSent=0,onlineCount=0,activity=null,countdownTimer=null,activityDismissed=false,unreadCount=0;

    function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2;draw();}function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}

    function avatar(p,isMe,t){const color=isMe?theme.accent:(p.color||'#68cbe5'),bob=Math.sin(t/460+(p.seat||0))*1.5;ctx.save();ctx.fillStyle=color+'55';ctx.beginPath();ctx.arc(p.x,p.y+bob,17,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y+bob,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-2,p.y-2+bob,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#152a40';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText((p.name||'同学').slice(0,10)+(isMe?'（你）':''),p.x,p.y-14+bob);ctx.restore();}
    function bubble(p,text){if(!text)return;ctx.save();ctx.font='12px sans-serif';const label=text.length>34?text.slice(0,33)+'…':text,w=Math.min(260,Math.max(100,ctx.measureText(label).width+18)),x=Math.max(32,Math.min(W-w-32,p.x-w/2));round(x,p.y-48,w,28,10,'#fffdf4','#fff');ctx.fillStyle='#243b50';ctx.textAlign='center';ctx.fillText(label,x+w/2,p.y-30,w-12);ctx.restore();}
    function draw(){if(!ctx||!canvas.width)return;const now=performance.now();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);const wall=ctx.createLinearGradient(0,20,0,H);wall.addColorStop(0,'#fbfaf3');wall.addColorStop(.26,theme.wall);wall.addColorStop(1,theme.floor);round(24,22,W-48,H-44,22,wall,'#d8edfa');ctx.save();ctx.beginPath();ctx.roundRect(25,23,W-50,H-46,21);ctx.clip();ctx.fillStyle='#ffffff22';for(let y=230;y<H;y+=45){ctx.fillRect(25,y,W-50,2);for(let x=45+(Math.floor(y/45)%2)*40;x<W;x+=80)ctx.fillRect(x,y-43,2,43);}round(400,55,300,100,12,theme.board,'#d8c49a');ctx.fillStyle='#fff6db';ctx.textAlign='center';ctx.font='bold 21px sans-serif';ctx.fillText(roomName.length>22?roomName.slice(0,21)+'…':roomName,550,98);ctx.font='14px sans-serif';ctx.fillText(theme.motto,550,128);ctx.font='26px sans-serif';ctx.fillText(theme.icon,90,100);ctx.fillText(theme.icon,1010,100);round(485,170,130,30,7,'#87664f','#e4c49b');desks.forEach(drawDesk);ctx.restore();for(const d of desks){const p=users.get(String(d.seat));if(p)avatar(p,p.uid===uid,now);else{ctx.fillStyle='#a8bac744';ctx.beginPath();ctx.ellipse(d.x,d.y+38,12,5,0,0,Math.PI*2);ctx.fill();}}if(joined){avatar(player,true,now);const nowMs=Date.now();for(const p of users.values()){if(p.uid===uid)continue;if(Math.hypot(p.x-player.x,p.y-player.y)<90){const msg=recent.get(p.uid),text=msg&&nowMs-msg.time<10000?msg.text:(p.bubble||'');if(text)bubble(p,text);}}const ownMsg=recent.get(uid);if(ownMsg&&nowMs-ownMsg.time<10000)bubble(player,ownMsg.text);}ctx.restore();}
    function updateCounter(s){onlineCount=s.numChildren();$('counter').textContent=`🟢 在线 ${onlineCount} / 50 人${player.seat>=0?' · 座位 '+(player.seat+1):''}`;updateActivity(activity);}function updateActivity(value){activity=value;if(!joined||!activity||!activity.enabled||!activity.url||onlineCount<(Number(activity.threshold)||10)){clearInterval(countdownTimer);countdownTimer=null;$('activity-modal').classList.remove('open');return;}const marker=`activity:${roomKey}:${activity.updatedAt||activity.url}`;if(activityDismissed||sessionStorage.getItem(marker))return;$('activity-modal').classList.add('open');$('activity-desc').textContent=`已有 ${onlineCount} 位同学在线，${Number(activity.countdownSeconds)||10} 秒后自动打开 Wayground。`;if(!countdownTimer){let remaining=Math.max(1,Number(activity.countdownSeconds)||10);$('countdown').textContent=remaining;countdownTimer=setInterval(()=>{if(!activity||onlineCount<(Number(activity.threshold)||10)){clearInterval(countdownTimer);countdownTimer=null;$('activity-modal').classList.remove('open');return;}$('countdown').textContent=--remaining;if(remaining<=0){clearInterval(countdownTimer);countdownTimer=null;sessionStorage.setItem(marker,'opened');location.href=activity.url;}},1000);}}
    function showError(text){$('login-error').textContent=text;}async function reserveSeat(name){for(let n=1;n<=50;n++){const ref=seatsRef().child(String(n)),result=await ref.transaction(old=>old===null?{uid,name,joinedAt:firebase.database.ServerValue.TIMESTAMP}:undefined,false);if(result.committed&&result.snapshot.val().uid===uid)return n;}return -1;}

    function loop(t){if(!joined)return;const dt=Math.min((t-(loop.last||t))/1000,.04);loop.last=t;let dx=0,dy=0;if(keys.has('ArrowLeft'))dx--;if(keys.has('ArrowRight'))dx++;if(keys.has('ArrowUp'))dy--;if(keys.has('ArrowDown'))dy++;if(dx&&dy){dx*=Math.SQRT1_2;dy*=Math.SQRT1_2;}player.x=Math.max(45,Math.min(W-45,player.x+dx*220*dt));player.y=Math.max(205,Math.min(H-55,player.y+dy*220*dt));draw();if(Date.now()-lastSent>180&&(dx||dy)){lastSent=Date.now();playersRef().child(uid).update({x:player.x,y:player.y,bubble:player.bubble,updatedAt:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});}requestAnimationFrame(loop);}
    function norm(k){if(k.startsWith('Arrow'))return k;return({w:'ArrowUp',s:'ArrowDown',a:'ArrowLeft',d:'ArrowRight'})[k.toLowerCase()]||k;}document.addEventListener('keydown',e=>{const k=norm(e.key);if(joined&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault();keys.add(k);}});document.addEventListener('keyup',e=>keys.delete(norm(e.key)));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('.move-key').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys.delete(k)));});
    $('login-form').addEventListener('submit',e=>{e.preventDefault();const name=$('username-input').value.trim(),fixedBubble=$('bubble-input').value.trim();if(name)join(name,fixedBubble);});$('chat-form').addEventListener('submit',async e=>{e.preventDefault();if(!joined)return;const input=$('chat-input'),text=input.value.trim();if(!text)return;input.value='';try{await messagesRef().push({uid,name:player.name,text,createdAt:firebase.database.ServerValue.TIMESTAMP});}catch(err){input.value=text;alert('发送失败，请检查数据库规则及网络。');}});
    function openActivity(){if(activity&&activity.url&&onlineCount>=(Number(activity.threshold)||10)){sessionStorage.setItem(`activity:${roomKey}:${activity.updatedAt||activity.url}`,'opened');location.href=activity.url;}}$('join-activity').addEventListener('click',openActivity);$('cancel-activity').addEventListener('click',()=>{activityDismissed=true;clearInterval(countdownTimer);countdownTimer=null;$('activity-modal').classList.remove('open');});$('leave-btn').addEventListener('click',async()=>{joined=false;clearInterval(countdownTimer);if(uid&&player.seat>=0)try{await Promise.all([playersRef().child(uid).remove(),seatsRef().child(String(player.seat+1)).remove()]);}catch(e){}location.href='index.html';});window.addEventListener('resize',resize);
    try{firebase.initializeApp(firebaseConfig);db=firebase.database();resize();}catch(e){showError('Firebase 初始化失败，请检查配置。');$('start-btn').disabled=true;}
  })();
  </script>
</body>
</html>
