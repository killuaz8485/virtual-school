<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟学校 3D 政策岛模式</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a2e; font-family: sans-serif; }
        #info-card {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 300px;
            transition: all 0.3s ease; pointer-events: none; opacity: 0;
        }
        #info-card.active { opacity: 1; pointer-events: auto; }
        #info-card h2 { margin: 0 0 5px 0; color: #162447; font-size: 18px; }
        #info-card p { margin: 0; color: #e43f5a; font-size: 14px; font-weight: bold; }
        #title { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
    <!-- 引入 Three.js 核心库 -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="title">🏫 虚拟学校 3D 岛屿地图</div>
    <div id="info-card" id="card">
        <h2 id="island-name">学院名称</h2>
        <p id="island-desc">点击查看课程成果</p>
    </div>

    <script>
        // 1. 初始化场景、相机和渲染器
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. 定义虚拟学校的岛屿数据（类似沈伯洋的板块拆解）
        const schools = [
            { name: "理学院岛 🧪", color: 0x4e9f3d, x: -2, z: 0, desc: "探索微积分与AI的奥秘" },
            { name: "文学院岛 📚", color: 0xff9f43, x: 0, z: -1.5, desc: "数字人文与新媒体艺术展" },
            { name: "魔法社团岛 🪄", color: 0x9b5de5, x: 2, z: 0, desc: "这里有最酷炫的交互设计" },
            { name: "行政资源岛 🏛️", color: 0x00bbf9, x: 0, z: 1.5, desc: "虚拟校长室与选课指南" }
        ];

        const islandMeshes = [];

        // 4. 用六角柱体（Cylinder）模拟卡坦岛/政策岛的六边形岛屿
        schools.forEach((data) => {
            // 参数：顶部半径, 底部半径, 高度, 侧面分段数(6代表六边形)
            const geometry = new THREE.CylinderGeometry(1, 1, 0.5, 6);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.3,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.x, 0, data.z);
            mesh.userData = data; // 绑定数据
            scene.add(mesh);
            islandMeshes.push(mesh);
        });

        // 5. 动画循环：让岛屿像政策岛一样上下微微浮动
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            islandMeshes.forEach((mesh, index) => {
                // 运用正弦函数实现错落有致的浮动效果
                mesh.position.y = Math.sin(time + index * 2) * 0.1;
                mesh.rotation.y += 0.005; // 缓缓自转
            });
            
            renderer.render(scene, camera);
        }
        animate();

        // 6. 手机端触摸/点击交互（Raycaster 射线检测）
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const card = document.getElementById('info-card');
        const nameEl = document.getElementById('island-name');
        const descEl = document.getElementById('island-desc');

        function onTouch(event) {
            // 兼容手机端触摸位置
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            
            if(!clientX) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(islandMeshes);

            if (intersects.length > 0) {
                const clickedIsland = intersects[0].object.userData;
                nameEl.innerText = clickedIsland.name;
                descEl.innerText = clickedIsland.desc;
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        }

        window.addEventListener('click', onTouch);
        window.addEventListener('touchstart', onTouch);

        // 7. 屏幕尺寸适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
