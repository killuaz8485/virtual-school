<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟学校 3D 政策岛模式</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a2e; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #title { position: absolute; top: 20px; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        /* 岛屿容器与浮动动画 */
        .map-container { width: 100vw; height: 60vh; display: flex; justify-content: center; align-items: center; }
        svg { width: 100%; height: 100%; overflow: visible; }
        
        .island { cursor: pointer; transition: transform 0.3s ease; animation: float 4s ease-in-out infinite; }
        .island:nth-child(2) { animation-delay: -1s; }
        .island:nth-child(3) { animation-delay: -2s; }
        .island:nth-child(4) { animation-delay: -3s; }
        
        .island:hover, .island:active { transform: scale(1.1) translateY(-10px) !important; filter: brightness(1.2); }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 交互信息卡片 */
        #info-card {
            position: absolute; bottom: 40px; background: rgba(255, 255, 255, 0.95); 
            padding: 15px 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center; width: 80%; max-width: 300px; transition: all 0.3s ease; 
            opacity: 0; transform: translateY(20px); pointer-events: none;
        }
        #info-card.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #info-card h2 { margin: 0 0 5px 0; color: #162447; font-size: 18px; }
        #info-card p { margin: 0; color: #e43f5a; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="title">🏫 虚拟学校 3D 岛屿地图</div>

    <div class="map-container">
        <!-- 使用 SVG 绘制仿 3D 轴测视角的六边形岛屿集群（参考政策岛） -->
        <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
            <!-- 理学院岛 (左) -->
            <g class="island" onclick="showIsland('理学院岛 🧪', '探索微积分与 AI 绘画的奥秘')">
                <polygon points="120,160 170,130 220,160 220,200 170,230 120,200" fill="#4e9f3d" stroke="#3a7d2c" stroke-width="2"/>
                <polygon points="120,200 170,230 170,250 120,220" fill="#3a7d2c"/>
                <polygon points="220,200 170,230 170,250 220,220" fill="#295a1e"/>
                <text x="170" y="185" fill="white" font-size="14" font-weight="bold" text-anchor="middle">理学院</text>
            </g>

            <!-- 文学院岛 (上) -->
            <g class="island" onclick="showIsland('文学院岛 📚', '数字人文与新媒体艺术展演中心')">
                <polygon points="200,80 250,50 300,80 300,120 250,150 200,120" fill="#ff9f43" stroke="#d37e2b" stroke-width="2"/>
                <polygon points="200,120 250,150 250,170 200,140" fill="#d37e2b"/>
                <polygon points="300,120 250,150 250,170 300,140" fill="#a65f1a"/>
                <text x="250" y="105" fill="white" font-size="14" font-weight="bold" text-anchor="middle">文学院</text>
            </g>

            <!-- 魔法社团岛 (右) -->
            <g class="island" onclick="showIsland('魔法社团岛 🪄', '这里有最酷炫的交互设计与桌游社')">
                <polygon points="280,160 330,130 380,160 380,200 330,230 280,200" fill="#9b5de5" stroke="#7b42c4" stroke-width="2"/>
                <polygon points="280,200 330,230 330,250 280,220" fill="#7b42c4"/>
                <polygon points="380,200 330,230 330,250 380,220" fill="#5c2e99"/>
                <text x="330" y="185" fill="white" font-size="14" font-weight="bold" text-anchor="middle">社团岛</text>
            </g>

            <!-- 行政资源岛 (下) -->
            <g class="island" onclick="showIsland('行政资源岛 🏛️', '虚拟校长室与教务处选课指南')">
                <polygon points="200,240 250,210 300,240 300,280 250,310 200,280" fill="#00bbf9" stroke="#0096c7" stroke-width="2"/>
                <polygon points="200,280 250,310 250,330 200,300" fill="#0096c7"/>
                <polygon points="300,280 250,310 250,330 300,300" fill="#0077b6"/>
                <text x="250" y="265" fill="white" font-size="14" font-weight="bold" text-anchor="middle">行政岛</text>
            </g>
        </svg>
    </div>

    <div id="info-card">
        <h2 id="island-name">学院名称</h2>
        <p id="island-desc">点击查看课程成果</p>
    </div>

    <script>
        const card = document.getElementById('info-card');
        const nameEl = document.getElementById('island-name');
        const descEl = document.getElementById('island-desc');

        function showIsland(name, desc) {
            nameEl.innerText = name;
            descEl.innerText = desc;
            card.classList.add('active');
            
            // 点击空白处或3秒后自动隐藏卡片
            setTimeout(() => {
                // 如果用户点击了其他岛，就不自动隐藏
                if(nameEl.innerText === name) {
                    // card.classList.remove('active');
                }
            }, 5000);
        }

        // 点击背景关闭卡片
        document.body.addEventListener('click', (e) => {
            if (!e.target.closest('.island')) {
                card.classList.remove('active');
            }
        }, true);
    </script>
</body>
</html>
